name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          # Android SDK is pre-installed on ubuntu-latest runner
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME

      - name: Install required Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        env:
          EPHEMERIS_BASE_URL: ${{ secrets.EPHEMERIS_BASE_URL }}
        run: |
          ./gradlew --no-daemon :app:assembleDebug \
            -PEPHEMERIS_BASE_URL="$EPHEMERIS_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghan-sarvatobhadra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
